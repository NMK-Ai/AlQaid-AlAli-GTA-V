name: Source and simulator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.5.3
      - run: python scripts/test-portability.py
      - run: python -m unittest discover -s bridge -p "test_*.py"
      - run: cmake -S native -B build/tests -DBUILD_GTA_ADAPTER=OFF
      - run: cmake --build build/tests --config Release --parallel 2
      - run: ctest --test-dir build/tests -C Release --output-on-failure
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            $failures += $errors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
      - name: Validate shell syntax
        if: runner.os == 'Linux'
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Exercise installer with fake game files
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installation.ps1
